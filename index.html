<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Robotic Arm Challenge</title>
    <!-- ONNX Runtime Web CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #F0F4F8;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        canvas {
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 95vw;
            max-height: 95vh;
            aspect-ratio: 800 / 600;
        }
        #loader {
            width: 20px;
            height: 20px;
            background-color: #34495E;
            border-radius: 50%;
            animation: pulsate 1.5s ease-in-out infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes pulsate {
            0% { transform: scale(0.8); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loader"></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // --- Core Game Logic and AI Integration ---
        document.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const loader = document.getElementById('loader');

            // --- Game Constants ---
            const SCREEN_WIDTH = 800;
            const SCREEN_HEIGHT = 600;
            const ANGLE_STEP_SIZE = 5.0;
            const MAX_JOINTS = 2;

            const COLORS = {
                ARM: "#34495E",
                JOINTS: "#E74C3C",
                BUTTON: "#2ECC71",
                BUTTON_PRESSED: "#27AE60",
                PARTICLE: ["#E74C3C", "#F1C40F", "#3498DB", "#2ECC71"]
            };

            let ortSession = null;
            let currentLevelIndex = 0;
            let arm = null;
            let target = null;
            let particles = [];
            let winTimer = 0;

            function resizeCanvas() {
                const container = document.getElementById('game-container');
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                const aspectRatio = SCREEN_WIDTH / SCREEN_HEIGHT;

                let newWidth = containerWidth;
                let newHeight = newWidth / aspectRatio;

                if (newHeight > containerHeight) {
                    newHeight = containerHeight;
                    newWidth = newHeight * aspectRatio;
                }

                canvas.width = SCREEN_WIDTH;
                canvas.height = SCREEN_HEIGHT;
                canvas.style.width = `${newWidth}px`;
                canvas.style.height = `${newHeight}px`;
            }

            class RoboticArm {
                constructor(baseX, baseY, numSegments, segmentLength) {
                    this.basePos = { x: baseX, y: baseY };
                    this.numSegments = numSegments;
                    this.segmentLength = segmentLength;
                    this.segments = Array.from({ length: numSegments }, () => ({
                        angle: 0,
                        startPos: { x: 0, y: 0 },
                        endPos: { x: 0, y: 0 },
                    }));
                }
                update(angles) {
                    let currentPos = { ...this.basePos };
                    let totalAngle = 0;
                    for (let i = 0; i < this.numSegments; i++) {
                        this.segments[i].angle = angles[i];
                        totalAngle += angles[i];
                        this.segments[i].startPos = { ...currentPos };
                        const angleRad = totalAngle * (Math.PI / 180);
                        currentPos.x += this.segmentLength * Math.cos(angleRad);
                        currentPos.y -= this.segmentLength * Math.sin(angleRad);
                        this.segments[i].endPos = { ...currentPos };
                    }
                }
                getEndEffectorPos() {
                    return this.segments[this.numSegments - 1].endPos;
                }
                draw() {
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    this.segments.forEach(seg => {
                        ctx.beginPath();
                        ctx.moveTo(seg.startPos.x, seg.startPos.y);
                        ctx.lineTo(seg.endPos.x, seg.endPos.y);
                        ctx.strokeStyle = COLORS.ARM;
                        ctx.lineWidth = 15;
                        ctx.stroke();
                    });
                    this.segments.forEach(seg => {
                        ctx.beginPath();
                        ctx.arc(seg.startPos.x, seg.startPos.y, 12, 0, 2 * Math.PI);
                        ctx.fillStyle = COLORS.ARM;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(seg.endPos.x, seg.endPos.y, 8, 0, 2 * Math.PI);
                        ctx.fillStyle = COLORS.JOINTS;
                        ctx.fill();
                    });
                }
            }

            class TargetButton {
                constructor(x, y, radius) {
                    this.pos = { x, y };
                    this.radius = radius;
                    this.isPressed = false;
                    this.animationScale = 1.0;
                }
                checkCollision(point) {
                    if (this.isPressed) return false;
                    const distSq = (point.x - this.pos.x) ** 2 + (point.y - this.pos.y) ** 2;
                    if (distSq < this.radius ** 2) {
                        this.isPressed = true;
                        this.animationScale = 1.8;
                        return true;
                    }
                    return false;
                }
                update() {
                    if (this.isPressed && this.animationScale > 1.0) {
                        this.animationScale -= (this.animationScale - 1.0) * 0.15;
                    }
                }
                draw() {
                    const color = this.isPressed ? COLORS.BUTTON_PRESSED : COLORS.BUTTON;
                    const currentRadius = this.radius * this.animationScale;
                    ctx.beginPath();
                    ctx.arc(this.pos.x, this.pos.y, currentRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = this.isPressed ? "#27AE60" : "#29B765";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            }

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.radius = Math.random() * 5 + 3;
                    this.lifespan = 60;
                    this.color = COLORS.PARTICLE[Math.floor(Math.random() * COLORS.PARTICLE.length)];
                    const angle = Math.random() * 2 * Math.PI;
                    const speed = Math.random() * 4 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.1;
                    this.lifespan--;
                    this.radius *= 0.98;
                }
                draw() {
                    if (this.lifespan <= 0 || this.radius <= 0.1) return;
                    ctx.globalAlpha = this.lifespan / 60;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            // --- AI & Observation Logic ---
            function softmax(arr) {
            // BigInt 또는 기타 타입을 number로 변환
                const arrNum = Array.from(arr, Number);
                const max = Math.max(...arrNum);
                const exps = arrNum.map(x => Math.exp(x - max));
                const sum = exps.reduce((a, b) => a + b, 0);
                return exps.map(e => e / sum);
            }
            function argMax(array) {
                const arrNum = Array.from(array, Number);
                if (arrNum.length === 0) return -1;
                return arrNum
                    .map((value, index) => [value, index])
                    .reduce((best, current) => (current[0] > best[0] ? current : best))[1];
            }
            function normalizeCoords(x, y) {
                return [2 * (x / SCREEN_WIDTH) - 1, 2 * (y / SCREEN_HEIGHT) - 1];
            }
            function getObservation() {
                const angles = arm.segments.map(s => s.angle);
                const paddedAngles = angles.concat(Array(MAX_JOINTS - angles.length).fill(0));
                const normAngles = paddedAngles.map(a => a / 180.0);
                const endEffectorPos = arm.getEndEffectorPos();
                const normEndEffectorPos = normalizeCoords(endEffectorPos.x, endEffectorPos.y);
                const normTargetPos = normalizeCoords(target.pos.x, target.pos.y);
                const vectorToTarget = { x: target.pos.x - endEffectorPos.x, y: target.pos.y - endEffectorPos.y };
                const normVector = [vectorToTarget.x / SCREEN_WIDTH, vectorToTarget.y / SCREEN_HEIGHT];
                return new Float32Array([...normAngles, ...normEndEffectorPos, ...normTargetPos, ...normVector]);
            }

            const levels = [
                { numSegments: 2, segmentLength: 120 }
            ];

            function setupLevel() {
                if (currentLevelIndex >= levels.length) {
                    currentLevelIndex = 0;
                }
                const level = levels[currentLevelIndex];
                arm = new RoboticArm(SCREEN_WIDTH / 2, SCREEN_HEIGHT, level.numSegments, level.segmentLength);
                const maxReach = arm.numSegments * arm.segmentLength;
                const minReach = maxReach * 0.3;
                const basePos = arm.basePos;
                let buttonX, buttonY;
                while (true) {
                    buttonX = Math.random() * (SCREEN_WIDTH - 100) + 50;
                    buttonY = Math.random() * (SCREEN_HEIGHT - 200) + 50;
                    const distance = Math.sqrt((buttonX - basePos.x)**2 + (buttonY - basePos.y)**2);
                    if (distance > minReach && distance < maxReach * 0.95) {
                        break;
                    }
                }
                target = new TargetButton(buttonX, buttonY, 25);
                particles = [];
                winTimer = 0;
                arm.update(Array(arm.numSegments).fill(0));
            }

            async function initialize() {
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
                try {
                    ortSession = await ort.InferenceSession.create('./model.onnx');
                    console.log("ONNX model loaded successfully.");
                } catch (e) {
                    console.error("Failed to load ONNX model:", e);
                    loader.innerText = "Error: model.onnx not found.";
                    return;
                }
                loader.style.display = 'none';
                setupLevel();
                gameLoop();
            }

            async function gameLoop() {
                if (ortSession && !target.isPressed) {
                    const obs = getObservation();
                    const tensor = new ort.Tensor('float32', obs, [1, obs.length]);
                    const feeds = { 'observation': tensor };
                    const results = await ortSession.run(feeds);
                    const actionProbabilities = results.action.data;
                    // --- softmax 적용 후 argMax ---
                    const probs = softmax(Array.from(actionProbabilities));
                    const action = argMax(probs);

                    // --- 디버깅 ---
                    if (!window.frameCount) window.frameCount = 0;
                    window.frameCount++;
                    if (window.frameCount % 60 === 1) {
                        console.log("AI decision:", {
                            action: action,
                            rawOutput: actionProbabilities,
                            softmax: probs
                        });
                    }
                    // --- END 디버깅 ---

                    const currentAngles = arm.segments.map(s => s.angle);
                    if (action > 0) {
                        const jointIndex = Math.floor((action - 1) / 2);
                        const direction = (action - 1) % 2 === 0 ? 1 : -1;
                        if (jointIndex < currentAngles.length) {
                            currentAngles[jointIndex] += direction * ANGLE_STEP_SIZE;
                            currentAngles[jointIndex] = Math.max(-180, Math.min(180, currentAngles[jointIndex]));
                        }
                    }
                    arm.update(currentAngles);
                }
                target.update();
                particles.forEach(p => p.update());
                particles = particles.filter(p => p.lifespan > 0);

                if (!target.isPressed) {
                    if (target.checkCollision(arm.getEndEffectorPos())) {
                        winTimer = 120;
                        for (let i = 0; i < 60; i++) {
                            particles.push(new Particle(target.pos.x, target.pos.y));
                        }
                    }
                } else {
                    winTimer--;
                    if (winTimer <= 0) {
                        currentLevelIndex++;
                        setupLevel();
                    }
                }
                ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
                particles.forEach(p => p.draw());
                arm.draw();
                target.draw();
                requestAnimationFrame(gameLoop);
            }

            initialize();
        });
    </script>
</body>

</html>
